<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>say yes or i kill myself</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Fredoka', sans-serif;
        background-color: #153d0e;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
        overflow: hidden;
        transition: background 0.5s ease;
    }

    .container {
        position: relative;
        max-width: 400px;
        padding: 20px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 20px;
        color: #dc8c18;
    }

    img {
        width: 250px;
        border-radius: 20px;
        margin-bottom: 20px;
    }

    .buttons {
        position: relative;
        height: 150px;
    }

    button {
        padding: 12px 25px;
        font-size: 18px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        position: absolute;
        transition: transform 0.2s ease;
    }

    #yesBtn {
        background-color: #42d961;
        color: white;
        left: 50%;
        transform: translateX(-50%);
    }

    #yesBtn:hover {
        transform: translateX(-50%) scale(1.1);
    }

    #noBtn {
        background-color: #990000;
        color: #cc0066;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
    }

    .celebrate {
        background-color: #ff99cc !important;
    }

    .confetti {
        position: fixed;
        font-size: 24px;
        animation: fall 3s linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(110vh); }
    }
</style>
</head>

<body>

<div class="container">
    <h1 id="question">Darlyn… will you be my Valentine? 💘</h1>

    <!-- Begging puppy GIF (replace if you want) -->
    <img id="mainGif" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="Begging Puppy">

    <div class="buttons">
        <button id="yesBtn">😄 yes ofc!!</button>
        <button id="noBtn">🦭 no (faggot)</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const gif = document.getElementById("mainGif");
const question = document.getElementById("question");
const body = document.body;

// Make NO button run away
function moveNoButton() {
    const container = document.querySelector(".buttons");
    const containerRect = container.getBoundingClientRect();

    const maxX = containerRect.width - noBtn.offsetWidth;
    const maxY = containerRect.height - noBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
    noBtn.style.transform = "none";
}

noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);

// YES button click
yesBtn.addEventListener("click", () => {
    question.textContent = "Smart move on your part!!!";
    
    // Celebration GIF (replace if you want)
    gif.src = "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif";

    body.classList.add("celebrate");

    createConfetti();
});

// Simple confetti hearts
function createConfetti() {
    for (let i = 0; i < 30; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.textContent = "👀";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
    }
}
</script>

</body>
</html>
